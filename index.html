<head>

  <!-- Favicon / browser tab icon (files live in /public) -->

  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png">

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Applies a saved/system dark-mode preference before the page paints,
       so returning dark-mode visitors don't see a flash of the light theme.
       This has to stay here in index.html (not in React): React only
       renders after its JavaScript loads, which is too late to avoid the
       flash. The theme toggle itself will be a React component. -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('theme');
        var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        /* localStorage unavailable (e.g. private browsing) — defaults to light mode */
      }
    })();
  </script>

</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
